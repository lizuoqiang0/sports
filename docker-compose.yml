# 生产编排（高性能 · 低延迟 · 多 worker）
# 数据持久化: ./data/postgres ./data/redis ./logs
# 快速启动: bash scripts/quick.sh --init
# AI 引擎可选: bash scripts/quick.sh --init --with-ai
#
# 主机参考（12 核 / 16G）：backend 多 worker + uvloop；postgres/redis 多线程。
# Browser Gate 在 Mac/GUI 宿主机运行（弹出可见 Chromium），后端经 host.docker.internal 调用。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: ${BASE_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/postgres:16-alpine
    container_name: ob-postgres
    environment:
      POSTGRES_USER: ob_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ob_password}
      POSTGRES_DB: ob_sports
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - statement_timeout=60000
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=5
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: "512mb"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: ${PG_CPUS:-2.5}
    mem_limit: ${PG_MEM:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ob_user -d ob_sports"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: ${BASE_IMAGE_REGISTRY:-docker.m.daocloud.io}/library/redis:7-alpine
    container_name: ob-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "120"
      - "100"
      - --dir
      - /data
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-backlog
      - "511"
      - --timeout
      - "0"
      - --tcp-keepalive
      - "60"
      - --io-threads
      - "4"
      - --io-threads-do-reads
      - "yes"
      - --hz
      - "20"
      - --lazyfree-lazy-eviction
      - "yes"
      - --lazyfree-lazy-expire
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: ${REDIS_CPUS:-1.5}
    mem_limit: ${REDIS_MEM:-768m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.m.daocloud.io}
    image: ob-sports-betting-backend:latest
    container_name: ob-backend
    env_file:
      - .env
    environment:
      # 容器内主机名覆盖 .env 里的 localhost
      DATABASE_URL: postgresql+asyncpg://ob_user:${POSTGRES_PASSWORD:-ob_password}@postgres:5432/ob_sports
      REDIS_URL: redis://redis:6379/0
      LOG_FILE: /app/logs/app.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_BACKGROUND_JOBS: ${RUN_BACKGROUND_JOBS:-true}
      SECRET_KEY: ${SECRET_KEY:-ob-prod-please-override-with-openssl-rand-hex-32}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # 逗号分隔，避免 Compose 剥掉 JSON 数组引号导致启动失败
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,ob-backend}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-400}
      UVICORN_BACKLOG: ${UVICORN_BACKLOG:-2048}
      UVICORN_KEEPALIVE: ${UVICORN_KEEPALIVE:-5}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-12}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-100}
      # 唯一 AI 模型：DeepSeek（OpenAI-compatible 接口）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-v4-pro-0813}
      DEEPSEEK_TIMEOUT_SEC: ${DEEPSEEK_TIMEOUT_SEC:-90}
      LLM_CLIENT_TIMEOUT_SEC: ${LLM_CLIENT_TIMEOUT_SEC:-40}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      PROMPT_MAX_CHARS: ${PROMPT_MAX_CHARS:-6000}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      AI_ANALYZE_CONCURRENCY: ${AI_ANALYZE_CONCURRENCY:-2}
      AI_IDLE_RESCAN_SEC: ${AI_IDLE_RESCAN_SEC:-30}
      AI_SKIP_COOLDOWN_SEC: ${AI_SKIP_COOLDOWN_SEC:-300}
      AI_RECS_LIMIT: ${AI_RECS_LIMIT:-80}
      AI_LIVE_SCAN_LIMIT: ${AI_LIVE_SCAN_LIMIT:-120}
      AI_MATCH_CONTEXT_IN_BATCH: ${AI_MATCH_CONTEXT_IN_BATCH:-true}
      AI_SCAN_INTERVAL_SEC: ${AI_SCAN_INTERVAL_SEC:-120}
      AI_MATCH_CONTEXT_ENABLED: ${AI_MATCH_CONTEXT_ENABLED:-true}
      AI_MATCH_CONTEXT_TTL_SEC: ${AI_MATCH_CONTEXT_TTL_SEC:-21600}
      NOWSCORE_PROXY_URL: ${NOWSCORE_PROXY_URL:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.58}
      DEFAULT_BET_MODE: ${DEFAULT_BET_MODE:-manual}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      MIN_BET_AMOUNT: ${MIN_BET_AMOUNT:-100}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      BOOKMAKER_BROWSER_GATE_URL: ${BOOKMAKER_BROWSER_GATE_URL:-http://host.docker.internal:9277}
      BOOKMAKER_MANUAL_VENUE: ${BOOKMAKER_MANUAL_VENUE:-0}
      BOOKMAKER_DISABLE_SITES: ${BOOKMAKER_DISABLE_SITES:-}
      BOOKMAKER_BACKEND_URL: ${BOOKMAKER_BACKEND_URL:-http://127.0.0.1:8000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: ${BACKEND_CPUS:-4.0}
    mem_limit: ${BACKEND_MEM:-3g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.m.daocloud.io}
    image: ob-sports-betting-frontend:latest
    container_name: ob-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: ${FRONTEND_CPUS:-1.0}
    mem_limit: ${FRONTEND_MEM:-256m}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  ai-engine:
    profiles: ["ai"]
    image: ob-sports-betting-backend:latest
    container_name: ob-ai-engine
    command: ["python", "scripts/ai_betting_engine.py", "--all-users", "--live"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ob_user:${POSTGRES_PASSWORD:-ob_password}@postgres:5432/ob_sports
      REDIS_URL: redis://redis:6379/0
      LOG_FILE: /app/logs/app.log
      SECRET_KEY: ${SECRET_KEY:-ob-prod-please-override-with-openssl-rand-hex-32}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-v4-pro-0813}
      DEEPSEEK_TIMEOUT_SEC: ${DEEPSEEK_TIMEOUT_SEC:-90}
      LLM_CLIENT_TIMEOUT_SEC: ${LLM_CLIENT_TIMEOUT_SEC:-40}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      PROMPT_MAX_CHARS: ${PROMPT_MAX_CHARS:-6000}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      AI_ANALYZE_CONCURRENCY: ${AI_ANALYZE_CONCURRENCY:-2}
      AI_RECS_LIMIT: ${AI_RECS_LIMIT:-80}
      AI_LIVE_SCAN_LIMIT: ${AI_LIVE_SCAN_LIMIT:-120}
      AI_MATCH_CONTEXT_IN_BATCH: ${AI_MATCH_CONTEXT_IN_BATCH:-true}
      AI_SCAN_INTERVAL_SEC: ${AI_SCAN_INTERVAL_SEC:-120}
      AI_MATCH_CONTEXT_ENABLED: ${AI_MATCH_CONTEXT_ENABLED:-true}
      AI_MATCH_CONTEXT_TTL_SEC: ${AI_MATCH_CONTEXT_TTL_SEC:-21600}
      NOWSCORE_PROXY_URL: ${NOWSCORE_PROXY_URL:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.58}
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import sys; sys.exit(0 if b'ai_betting_engine.py' in Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    cpus: ${AI_CPUS:-1.5}
    mem_limit: ${AI_MEM:-1g}
    restart: unless-stopped
    logging: *default-logging
